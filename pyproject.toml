[project]
name = "conj"
version = "0.1.0"
description = "Terminal verb conjugator for French, Italian and English, built on open Wiktionary data"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "DATA_LICENSE.md"]
authors = [
    { name = "Guilherme D. Garcia", email = "guilherme.garcia@lli.ulaval.ca" }
]
requires-python = ">=3.12"
dependencies = [
    "rapidfuzz>=3.14.6",
    "textual>=8.2.8",
]

[project.scripts]
conj = "conj.cli:main"
conj-build = "conj.build:main"

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]
build = [
    "wordfreq>=3.1.1",
]

[tool.uv]
default-groups = ["dev", "build"]
